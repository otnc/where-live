<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>最速どこ住み当て</title>
    <meta property="og:title" content="最速どこ住み当て" />
    <meta property="og:description" content="最速でどこ住みかを当てます！" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="最速どこ住み当て" />
    <meta name="twitter:description" content="最速でどこ住みかを当てます！" />
  </head>
  <body>
    <h1>最速どこ住み当て</h1>
    <p id="pop">最速でどこ住みかを当てます！</p>
    <ul id="kouho"></ul>
    <div id="list">
      <button onclick="q()">スタート</button>
    </div>

    <hr />
    <div>
      Respect:
      <a target="_blank" href="https://sevenc7c.com/fastest_todoufuken/"
        >最速出身地当て</a
      >
      /
      <a target="_blank" href="https://hutinoatari.github.io/cheapTransfer/"
        >最安経路検索</a
      >
      <br />
      Made by:
      <a target="_blank" href="https://otoneko.cat/"
        >otoneko.</a
      >
      <br />
      <br />
      <a id="share" target="_blank" href="https://x.com/intent/post"
        >Twitterでシェア</a
      >
    </div>

    <script>
      const ken = [
        "北海道",
        "青森県",
        "岩手県",
        "宮城県",
        "秋田県",
        "山形県",
        "福島県",
        "茨城県",
        "栃木県",
        "群馬県",
        "埼玉県",
        "千葉県",
        "東京都",
        "神奈川県",
        "新潟県",
        "富山県",
        "石川県",
        "福井県",
        "山梨県",
        "長野県",
        "岐阜県",
        "静岡県",
        "愛知県",
        "三重県",
        "滋賀県",
        "京都府",
        "大阪府",
        "兵庫県",
        "奈良県",
        "和歌山県",
        "鳥取県",
        "島根県",
        "岡山県",
        "広島県",
        "山口県",
        "徳島県",
        "香川県",
        "愛媛県",
        "高知県",
        "福岡県",
        "佐賀県",
        "長崎県",
        "熊本県",
        "大分県",
        "宮崎県",
        "鹿児島県",
        "沖縄県",
      ];
      const gaba = 5000;
      let kouho = [];

      document.getElementById("share").href =
        `https://x.com/intent/post?text=${encodeURIComponent(location.href)}`;

      function buttons(...bs) {
        document.getElementById("list").replaceChildren(
          ...bs.map(([t, f]) => {
            const b = document.createElement("button");
            b.textContent = t;
            b.onclick = f;
            return b;
          }),
        );
      }

      function pop(t) {
        document.getElementById("pop").textContent = t;
      }

      function s(ks) {
        document.getElementById("kouho").replaceChildren(
          ...ks.map((k) => {
            const li = document.createElement("li");
            li.textContent = k;
            return li;
          }),
        );
      }

      function q() {
        if (!navigator.geolocation) {
          return nibun();
        }

        pop("今、家にいますか？");
        s([]);
        buttons(["はい", kyoka], ["いいえ", nibun]);
      }

      function kyoka() {
        pop("位置情報の取得と利用を許可しますか？");
        buttons(["許可する", sagasu], ["ブロック", nibun]);
      }

      function sagasu() {
        pop("特定中...");
        buttons();
        navigator.geolocation.getCurrentPosition(
          async (p) => {
            const lat = p.coords.latitude,
              lon = p.coords.longitude;

            if (p.coords.accuracy > gaba) {
              pop("位置情報の範囲がガバガバすぎてわかんなかったのりゃ。");
              return buttons(["次へ", nibun]);
            }

            try {
              const url = `https://geoapi.heartrails.com/api/json?method=searchByGeoLocation&x=${lon}&y=${lat}`;
              const res = await fetch(url);
              const data = await res.json();

              if (data.response.location && data.response.location.length > 0) {
                return r(data.response.location[0].prefecture);
              } else {
                pop("位置情報ではわかんなかったのりゃ。");
                return buttons(["次へ", nibun]);
              }
            } catch {
              pop("なんかできなかったのりゃ。");
              return buttons(["次へ", nibun]);
            }
          },
          () => {
            pop("位置情報が使えなかったからわかんなかったのりゃ。");
            return buttons(["次へ", nibun]);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 },
        );
      }

      function nibun() {
        kouho = [...ken];
        ask();
      }

      function ask() {
        if (kouho.length === 1) {
          return r(kouho[0], () => r("海外", fail));
        }

        const han = Math.ceil(kouho.length / 2);
        pop("以下のどこかに住んでいますか？");
        s(kouho.slice(0, han));
        buttons(
          [
            "はい",
            () => {
              kouho = kouho.slice(0, han);
              ask();
            },
          ],
          [
            "いいえ",
            () => {
              kouho = kouho.slice(han);
              ask();
            },
          ],
        );
      }

      function r(i, iie = nibun) {
        pop(`あなたは${i}住みですね？`);
        s([]);
        buttons(["はい", () => success(i)], ["いいえ", iie]);
      }

      function success(i) {
        pop(`あなたは${i}住みです！`);
        buttons(["もう一度", q]);
      }

      function fail() {
        pop("わかんなかったのりゃ。");
        buttons(["もう一度", q]);
      }
    </script>
  </body>
</html>
